name: Isometric Contributions
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-isometric-grid
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Generate
        uses: jasonlong/isometric-contributions@v1.0
        with:
          username: Rifleks
      - name: Commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Update isometric contributions"
          git push
