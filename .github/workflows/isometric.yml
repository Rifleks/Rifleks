name: Generate 3D Contributions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate 3D Grid
        uses: yoshiask/github-contribution-grid-snake@main
        with:
          github_user_name: Rifleks
          svg_out_path: github-contributions-3d.svg
          
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add github-contributions-3d.svg
          git commit -m "Update 3D contributions grid" || exit 0
          git push
