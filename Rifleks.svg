<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <linearGradient id="neon-gradient" x1="0%" y1="0%" x2="200%" y2="200%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#ff007f;#ff6b6b;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7b2cbf">
        <animate attributeName="stop-color" values="#7b2cbf;#ff0844;#f9ca24;#4facfe;#7b2cbf" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#00f2fe;#7b2cbf;#ff6b6b;#ff007f" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#ff007f;#7b2cbf;#00f2fe" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ff007f">
        <animate attributeName="stop-color" values="#ff007f;#00f2fe;#4facfe;#ff007f" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-extreme" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .cyber-line {
        stroke: url(#neon-gradient);
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-dasharray: 40, 400;
        animation: expand 5s ease-in-out infinite alternate;
      }
      @keyframes expand {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -60; }
      }
      
      .particle {
        animation: sparkle 3s ease-in-out infinite alternate;
        will-change: opacity, transform;
      }
      @keyframes sparkle {
        0% { opacity: 0.15; transform: scale(0.7); }
        100% { opacity: 0.9; transform: scale(1.3); }
      }
      
      .code-rain {
        animation: rain 6s linear infinite;
        will-change: transform, opacity;
      }
      @keyframes rain {
        0% { transform: translateY(-20px); opacity: 0; }
        20% { opacity: 0.5; }
        80% { opacity: 0.5; }
        100% { transform: translateY(20px); opacity: 0; }
      }
      
      .code-rain2 {
        animation: rain2 7s linear infinite;
        will-change: transform, opacity;
      }
      @keyframes rain2 {
        0% { transform: translateY(-25px); opacity: 0; }
        20% { opacity: 0.4; }
        80% { opacity: 0.4; }
        100% { transform: translateY(25px); opacity: 0; }
      }
      
      .typing-cursor {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      .bracket {
        animation: bracketPulse 3s ease-in-out infinite;
        will-change: opacity, transform;
      }
      @keyframes bracketPulse {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.1); }
      }
      
      .rotating-icon {
        animation: rotate 10s linear infinite;
        will-change: transform;
      }
      @keyframes rotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .slide-line {
        animation: slide 4s ease-in-out infinite alternate;
        will-change: transform, opacity;
      }
      @keyframes slide {
        0% { transform: translateX(-8px); opacity: 0.2; }
        100% { transform: translateX(8px); opacity: 0.5; }
      }
      
      .glow-pulse {
        animation: glowPulse 3s ease-in-out infinite alternate;
        will-change: opacity;
      }
      @keyframes glowPulse {
        0% { opacity: 0.2; }
        100% { opacity: 0.7; }
      }
      
      .float-delayed {
        animation: floatDelayed 7s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes floatDelayed {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      
      .fade-cycle {
        animation: fadeCycle 5s ease-in-out infinite;
        will-change: opacity;
      }
      @keyframes fadeCycle {
        0%, 100% { opacity: 0.1; }
        50% { opacity: 0.4; }
      }
      
      .text-container {
        animation: textPulse 5s ease-in-out infinite;
        transform-origin: center;
        will-change: transform;
      }
      @keyframes textPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.005); }
      }
      
      .scan-line {
        animation: scan 4s linear infinite;
        will-change: transform;
      }
      @keyframes scan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      
      .glow-layer {
        animation: glowPulseSoft 4s ease-in-out infinite;
        will-change: opacity;
      }
      @keyframes glowPulseSoft {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
      
      .extreme-glow {
        animation: extremePulse 5s ease-in-out infinite;
        will-change: opacity;
      }
      @keyframes extremePulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 0.4; }
      }
      
      .cyber-line-pulse {
        animation: linePulse 3s ease-in-out infinite alternate;
        will-change: opacity;
      }
      @keyframes linePulse {
        0% { opacity: 0.4; }
        100% { opacity: 0.8; }
      }
    </style>
  </defs>

  <rect width="800" height="220" fill="transparent" rx="16" />
  <rect width="800" height="220" fill="url(#neon-gradient)" opacity="0.03" rx="16" />

  <circle cx="80" cy="30" r="2.5" class="particle" style="animation-delay: 0.2s; fill: #00f2fe;" />
  <circle cx="720" cy="40" r="3.5" class="particle" style="animation-delay: 0.7s; fill: #ff007f;" />
  <circle cx="140" cy="180" r="2" class="particle" style="animation-delay: 1.2s; fill: #7b2cbf;" />
  <circle cx="670" cy="175" r="2.5" class="particle" style="animation-delay: 0.5s; fill: #f9ca24;" />
  <circle cx="50" cy="100" r="1.5" class="particle" style="animation-delay: 1.8s; fill: #00ff88;" />
  <circle cx="750" cy="110" r="2" class="particle" style="animation-delay: 0.9s; fill: #ff6b6b;" />
  <circle cx="400" cy="15" r="2" class="particle" style="animation-delay: 2.1s; fill: #4facfe;" />
  <circle cx="200" cy="45" r="1.8" class="particle" style="animation-delay: 1.5s; fill: #ff0844;" />
  <circle cx="600" cy="50" r="2.2" class="particle" style="animation-delay: 2.8s; fill: #00f2fe;" />
  <circle cx="300" cy="190" r="1.5" class="particle" style="animation-delay: 3.2s; fill: #f9ca24;" />
  <circle cx="500" cy="185" r="2" class="particle" style="animation-delay: 0.3s; fill: #7b2cbf;" />

  <text x="15" y="32" font-family="'Courier New', monospace" font-size="11" fill="#00f2fe" opacity="0.3" class="code-rain" style="animation-delay: 0s;">print()</text>
  <text x="15" y="55" font-family="'Courier New', monospace" font-size="9" fill="#ff007f" opacity="0.25" class="code-rain" style="animation-delay: 1.5s;">def</text>
  <text x="730" y="28" font-family="'Courier New', monospace" font-size="10" fill="#7b2cbf" opacity="0.25" class="code-rain2" style="animation-delay: 0.8s;">class</text>
  <text x="730" y="50" font-family="'Courier New', monospace" font-size="8" fill="#00ff88" opacity="0.2" class="code-rain2" style="animation-delay: 2.5s;">import</text>
  <text x="15" y="188" font-family="'Courier New', monospace" font-size="9" fill="#f9ca24" opacity="0.2" class="code-rain" style="animation-delay: 3.5s;">while</text>
  <text x="760" y="190" font-family="'Courier New', monospace" font-size="9" fill="#4facfe" opacity="0.2" class="code-rain" style="animation-delay: 4.5s;">for</text>
  <text x="680" y="195" font-family="'Courier New', monospace" font-size="8" fill="#ff6b6b" opacity="0.15" class="code-rain2" style="animation-delay: 3s;">try</text>
  <text x="35" y="195" font-family="'Courier New', monospace" font-size="8" fill="#00f2fe" opacity="0.15" class="code-rain2" style="animation-delay: 2.2s;">except</text>

  <g transform="translate(400, 110)" text-anchor="middle" dominant-baseline="central" font-family="'Impact', 'Arial Black', sans-serif" font-size="86" font-weight="900" letter-spacing="3">
    <g class="text-container">
      <text x="-10" y="10" fill="#05050a" opacity="0.9">RIFLEKS</text>
      <text x="-8" y="8" fill="#0a0a18" opacity="0.8">RIFLEKS</text>
      <text x="-6" y="6" fill="#12122a" opacity="0.7">RIFLEKS</text>
      <text x="-4" y="4" fill="#1a1a3a" opacity="0.6">RIFLEKS</text>
      <text x="-2" y="2" fill="#22224a" opacity="0.5">RIFLEKS</text>
      
      <text x="0" y="0" fill="url(#neon-gradient)" stroke="#ffffff" stroke-width="2" stroke-opacity="0.5" class="glow-layer">RIFLEKS</text>
      
      <text x="0" y="0" fill="none" stroke="url(#text-glow)" stroke-width="1.5" opacity="0.8" filter="url(#glow-strong)">RIFLEKS</text>
      
      <text x="0" y="0" fill="url(#text-glow)" class="extreme-glow">RIFLEKS</text>
      
      <text x="0" y="0" fill="#ffffff" opacity="0.08">RIFLEKS</text>
    </g>
  </g>

  <rect x="150" y="60" width="500" height="2" fill="url(#neon-gradient)" opacity="0.4" class="scan-line" />
  <rect x="150" y="157" width="500" height="2" fill="url(#neon-gradient)" opacity="0.4" class="scan-line" style="animation-direction: reverse; animation-duration: 5s;" />

  <line x1="180" y1="180" x2="620" y2="180" class="cyber-line" />

  <g filter="url(#glow-light)">
    <path d="M 145 70 L 128 70 L 128 140 L 145 140" fill="none" stroke="#00f2fe" stroke-width="3" class="cyber-line-pulse" />
    <path d="M 655 70 L 672 70 L 672 140 L 655 140" fill="none" stroke="#ff007f" stroke-width="3" class="cyber-line-pulse" />
  </g>

  <path d="M 100 40 L 100 55 L 115 55" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.4" class="slide-line" />
  <path d="M 700 40 L 700 55 L 685 55" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.4" class="slide-line" style="animation-delay: 0.8s;" />
  <path d="M 100 180 L 100 165 L 115 165" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.4" class="slide-line" style="animation-delay: 1.2s;" />
  <path d="M 700 180 L 700 165 L 685 165" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.4" class="slide-line" style="animation-delay: 1.8s;" />

  <circle cx="130" cy="55" r="3" fill="#00f2fe" opacity="0.3" class="glow-pulse" />
  <circle cx="670" cy="165" r="3" fill="#ff007f" opacity="0.3" class="glow-pulse" style="animation-delay: 0.5s;" />

  <text x="190" y="200" font-family="'Courier New', monospace" font-size="13" fill="#4facfe" opacity="0.5" class="float-delayed">
    <tspan>while True:</tspan>
  </text>
  <text x="210" y="216" font-family="'Courier New', monospace" font-size="11" fill="#00f2fe" opacity="0.35">
    <tspan>print('Rifleks')</tspan>
    <tspan class="typing-cursor" fill="#ff007f">_</tspan>
  </text>

  <text x="540" y="200" font-family="'Courier New', monospace" font-size="13" fill="#ff6b6b" opacity="0.4" class="float-delayed" style="animation-delay: 1.2s;">
    <tspan>class Developer:</tspan>
  </text>
  <text x="560" y="216" font-family="'Courier New', monospace" font-size="11" fill="#ff007f" opacity="0.3">
    <tspan>pass  # forever</tspan>
  </text>

  <text x="0" y="12" font-family="'Courier New', monospace" font-size="14" fill="#00f2fe" opacity="0.15" class="bracket" style="animation-delay: 0s;">{</text>
  <text x="790" y="12" font-family="'Courier New', monospace" font-size="14" fill="#ff007f" opacity="0.15" class="bracket" style="animation-delay: 0.6s;">}</text>
  <text x="0" y="210" font-family="'Courier New', monospace" font-size="14" fill="#7b2cbf" opacity="0.15" class="bracket" style="animation-delay: 1.2s;">[</text>
  <text x="790" y="210" font-family="'Courier New', monospace" font-size="14" fill="#f9ca24" opacity="0.15" class="bracket" style="animation-delay: 1.8s;">]</text>

  <text x="338" y="28" font-family="'Courier New', monospace" font-size="9" fill="#00ff88" opacity="0.25" class="rotating-icon">
    <tspan>🐍</tspan>
  </text>
  <text x="462" y="28" font-family="'Courier New', monospace" font-size="9" fill="#ff6b6b" opacity="0.25" class="rotating-icon" style="animation-duration: 8s;">
    <tspan>⚡</tspan>
  </text>

  <text x="345" y="202" font-family="'Courier New', monospace" font-size="8" fill="#4facfe" opacity="0.15" class="fade-cycle">
    <tspan>__name__ == '__main__'</tspan>
  </text>

  <rect x="15" y="15" width="3" height="190" fill="#00f2fe" opacity="0.15" class="fade-cycle" style="animation-duration: 4s;" />
  <rect x="782" y="15" width="3" height="190" fill="#ff007f" opacity="0.15" class="fade-cycle" style="animation-duration: 4.5s;" />
</svg>
